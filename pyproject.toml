[project]
name = "manga-tagger"
version = "0.1.0"
description = "Organize and tag a personal manga library"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anyio==4.10.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "lxml",
    "pillow",
    "pywebview[gtk]==6.2.1; sys_platform == 'linux'",
    "pywebview==6.2.1; sys_platform != 'linux'",
    "starlette==0.47.2",
    "tomli-w",
    "uvicorn",
]

[project.scripts]
manga-tagger = "manga_tagger.__main__:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_tagger"]

[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "manga_tagger/ui_dist"

[tool.hatch.build.targets.wheel.shared-data]
"assets/manga-tagger.desktop" = "share/applications/manga-tagger.desktop"
"assets/manga-tagger.svg" = "share/icons/hicolor/scalable/apps/manga-tagger.svg"
"assets/manga-tagger-512.png" = "share/icons/hicolor/512x512/apps/manga-tagger.png"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
