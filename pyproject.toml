[project]
name = "manga-tagger"
version = "0.1.0"
description = "Organize and tag a personal manga library"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anyio==4.10.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "lxml",
    "pillow",
    "pywebview[gtk]==6.2.1; sys_platform == 'linux'",
    "pywebview==6.2.1; sys_platform != 'linux'",
    "starlette==0.47.2",
    "tomli-w",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_tagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
